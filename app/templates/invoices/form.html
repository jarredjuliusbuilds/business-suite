{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">New Invoice</h3>
<form method="POST" id="invoice-form">
    {{ csrf_token() }}
    <div class="mb-3">
        <label class="form-label">Customer</label>
        <select name="customer_id" class="form-select" required>
            <option value="">Select a customer</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="row mb-3">
        <div class="col-6">
            <label class="form-label">Issue date</label>
            <input type="date" name="issue_date" class="form-control" value="{{ today }}" required>
        </div>
        <div class="col-6">
            <label class="form-label">Due date</label>
            <input type="date" name="due_date" class="form-control">
        </div>
    </div>

    <label class="form-label">Line items</label>
    <div id="line-items">
        <div class="line-item row g-2 mb-3">
            <div class="col-6">
                <input type="text" name="line_description[]" class="form-control" placeholder="Description">
            </div>
            <div class="col-2">
                <input type="text" name="line_quantity[]" inputmode="decimal" class="form-control line-qty" placeholder="Qty" value="1">
            </div>
            <div class="col-3">
                <input type="text" name="line_unit_price[]" inputmode="decimal" class="form-control line-price" placeholder="Price">
            </div>
            <div class="col-1">
                <button type="button" class="btn btn-outline-danger btn-sm remove-line">&times;</button>
            </div>
        </div>
    </div>
    <button type="button" id="add-line" class="btn btn-outline-secondary btn-sm mb-3">+ Add line</button>

    <div class="d-flex justify-content-end mb-3">
        <strong>Subtotal: R <span id="subtotal-display">0.00</span></strong>
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Create Invoice</button>
</form>
<div class="mt-4">
    <a href="{{ url_for('invoices.list') }}" class="btn btn-outline-secondary btn-sm w-100">
        <i class="bi bi-arrow-left"></i> Back to invoices
    </a>
</div>

<script>
document.getElementById('add-line').addEventListener('click', function () {
    const container = document.getElementById('line-items');
    const row = container.firstElementChild.cloneNode(true);
    row.querySelectorAll('input').forEach(input => input.value = input.classList.contains('line-qty') ? '1' : '');
    container.appendChild(row);
    attachRowEvents(row);
    updateSubtotal();
});

function attachRowEvents(row) {
    row.querySelector('.remove-line').addEventListener('click', function () {
        if (document.querySelectorAll('.line-item').length > 1) {
            row.remove();
            updateSubtotal();
        }
    });
    row.querySelectorAll('.line-qty, .line-price').forEach(input => {
        input.addEventListener('input', updateSubtotal);
    });
}

function updateSubtotal() {
    let subtotal = 0;
    document.querySelectorAll('.line-item').forEach(row => {
        const qty = parseFloat(row.querySelector('.line-qty').value) || 0;
        const price = parseFloat(row.querySelector('.line-price').value) || 0;
        subtotal += qty * price;
    });
    document.getElementById('subtotal-display').textContent = subtotal.toFixed(2);
}

document.querySelectorAll('.line-item').forEach(attachRowEvents);
</script>
{% endblock %}
