{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Profit & Loss</h3>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-sm btn-outline-secondary">Back to Dashboard</a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <form method="GET" class="row g-3">
            <div class="col-5">
                <label class="small fw-bold text-muted">Start Date</label>
                <input type="date" name="start" class="form-control" value="{{ start_date }}">
            </div>
            <div class="col-5">
                <label class="small fw-bold text-muted">End Date</label>
                <input type="date" name="end" class="form-control" value="{{ end_date }}">
            </div>
            <div class="col-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Go</button>
            </div>
        </form>
    </div>
</div>

<div class="row g-2 mb-4">
    <div class="col-6">
        <div class="card h-100 metric-card">
            <div class="card-body">
                <div class="metric-label mb-1">Total Income</div>
                <div class="fs-4 fw-bold text-success">R {{ "%.2f"|format(income) }}</div>
            </div>
        </div>
    </div>
    <div class="col-6">
        <div class="card h-100 metric-card">
            <div class="card-body">
                <div class="metric-label mb-1">Total Expenses</div>
                <div class="fs-4 fw-bold text-danger">R {{ "%.2f"|format(expenses) }}</div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <div class="card h-100 metric-card bg-primary text-white border-0 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div class="metric-label text-white-50">Net Profit</div>
                <div class="fs-3 fw-bold">R {{ "%.2f"|format(net_profit) }}</div>
            </div>
        </div>
    </div>
</div>

<div class="text-center mt-5">
    <p class="small text-muted">Period: {{ start_date }} to {{ end_date }}</p>
</div>
{% endblock %}
