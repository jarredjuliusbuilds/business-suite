{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Expense Summary</h3>
    <a href="{{ url_for('expenses.list') }}" class="btn btn-sm btn-outline-secondary">Back to List</a>
</div>

<div class="card mb-4 metric-card">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div class="metric-label">Total Spend</div>
        <div class="fs-3 fw-bold text-danger">R {{ "%.2f"|format(total) }}</div>
    </div>
</div>

<div class="list-group">
    {% for category, amount in category_totals %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ category }}</span>
        <strong class="text-danger">R {{ "%.2f"|format(amount) }}</strong>
    </div>
    {% endfor %}
</div>
{% endblock %}
