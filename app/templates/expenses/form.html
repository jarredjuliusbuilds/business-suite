{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">{{ 'Edit Expense' if expense else 'New Expense' }}</h3>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Amount</label>
        <div class="input-group">
            <span class="input-group-text">R</span>
            <input type="text" name="amount" inputmode="decimal" class="form-control" value="{{ '%.2f'|format(expense.amount) if expense else '' }}" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" value="{{ expense.date.isoformat() if expense else today }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-select">
            <option value="">None</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if expense and expense.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Supplier (optional)</label>
        <select name="supplier_id" class="form-select">
            <option value="">None</option>
            {% for s in suppliers %}
            <option value="{{ s.id }}" {% if expense and expense.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" name="description" class="form-control" value="{{ expense.description if expense else '' }}">
    </div>
    <button type="submit" class="btn btn-primary w-100">Save</button>
</form>

{% if expense %}
<form method="POST" action="{{ url_for('expenses.delete', expense_id=expense.id) }}" class="mt-2" onsubmit="return confirm('Delete this expense?');">
    <button type="submit" class="btn btn-outline-danger w-100">Delete</button>
</form>
{% endif %}
<div class="mt-4">
    <a href="{{ url_for('expenses.list') }}" class="btn btn-outline-secondary btn-sm w-100">
        <i class="bi bi-arrow-left"></i> Back to expenses
    </a>
</div>
{% endblock %}
