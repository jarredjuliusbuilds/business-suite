{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">{{ 'Edit Task' if task else 'New Task' }}</h3>
<form method="POST">
    {{ csrf_token() }}
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ task.title if task else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Due date (optional)</label>
        <input type="date" name="due_date" class="form-control" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Related contact (optional)</label>
        <select name="contact_id" class="form-select">
            <option value="">None</option>
            {% for c in contacts %}
            <option value="{{ c.id }}" {% if task and task.contact_id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save</button>
</form>

{% if task %}
<form method="POST" action="{{ url_for('tasks.delete', task_id=task.id) }}" class="mt-2" onsubmit="return confirm('Delete this task?');">
    {{ csrf_token() }}
    <button type="submit" class="btn btn-outline-danger w-100">Delete</button>
</form>
{% endif %}

<div class="mt-4">
    <a href="{{ url_for('tasks.list') }}" class="btn btn-outline-secondary btn-sm w-100">
        <i class="bi bi-arrow-left"></i> Back to tasks
    </a>
</div>
{% endblock %}
