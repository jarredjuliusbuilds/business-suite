<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Business Suite{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container py-4 pb-5" style="max-width: 480px; padding-bottom: 80px !important;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    {% if current_user.is_authenticated %}
    <nav class="navbar fixed-bottom bg-white border-top">
        <div class="container-fluid d-flex justify-content-around py-1" style="max-width: 480px;">
            <a href="{{ url_for('dashboard.index') }}" class="text-decoration-none text-center {{ 'text-primary' if request.endpoint == 'dashboard.index' else 'text-muted' }}" style="font-size: 11px;">
                <i class="bi bi-house{{ '-fill' if request.endpoint == 'dashboard.index' else '' }}" style="font-size: 20px;"></i>
                <div>Home</div>
            </a>
            <a href="{{ url_for('contacts.list') }}" class="text-decoration-none text-center {{ 'text-primary' if request.endpoint and request.endpoint.startswith('contacts.') else 'text-muted' }}" style="font-size: 11px;">
                <i class="bi bi-people{{ '-fill' if request.endpoint and request.endpoint.startswith('contacts.') else '' }}" style="font-size: 20px;"></i>
                <div>Contacts</div>
            </a>
            <a href="{{ url_for('invoices.list') }}" class="text-decoration-none text-center {{ 'text-primary' if request.endpoint and request.endpoint.startswith('invoices.') else 'text-muted' }}" style="font-size: 11px;">
                <i class="bi bi-receipt{{ '' if request.endpoint and request.endpoint.startswith('invoices.') else '' }}" style="font-size: 20px;"></i>
                <div>Invoices</div>
            </a>
            <a href="{{ url_for('expenses.list') }}" class="text-decoration-none text-center {{ 'text-primary' if request.endpoint and request.endpoint.startswith('expenses.') else 'text-muted' }}" style="font-size: 11px;">
                <i class="bi bi-wallet2" style="font-size: 20px;"></i>
                <div>Expenses</div>
            </a>
            <a href="{{ url_for('tasks.list') }}" class="text-decoration-none text-center {{ 'text-primary' if request.endpoint and request.endpoint.startswith('tasks.') else 'text-muted' }}" style="font-size: 11px;">
                <i class="bi bi-check2-square" style="font-size: 20px;"></i>
                <div>Tasks</div>
            </a>
        </div>
    </nav>
    {% endif %}
</body>
</html>
